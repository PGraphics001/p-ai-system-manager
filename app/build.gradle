plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pgraphics.paisystemmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pgraphics.paisystemmanager'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // Firebase dependency management
    implementation platform('com.google.firebase:firebase-bom:35.1.0')

    // Retained for the existing PAIApplication.java
    implementation 'com.google.firebase:firebase-appcheck-debug'
}