plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pgraphics.paisystemmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pgraphics.paisystemmanager'

        minSdk 24
        targetSdk 28

        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Offline speech recognition
    implementation 'com.alphacephei:vosk-android:0.3.75'
}